[project]
name = "retinexformer"
version = "0.1.0"
description = "Low-light image enhancement toolbox based on Retinexformer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "matplotlib",
    "scikit-learn",
    "scikit-image",
    "opencv-python",
    "yacs",
    "joblib",
    "natsort",
    "h5py",
    "tqdm",
    "tensorboard",
    "einops",
    "gdown",
    "addict",
    "future",
    "lmdb",
    "numpy",
    "pyyaml",
    "requests",
    "scipy",
    "yapf",
    "lpips",
    "thop",
    "timm",
    "cython",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
package = false
